const CustomTooltip = ({ active, payload, label, suffix = "" }) => {

    );
  }
  return null;
};

// ── beeswarm (standalone) ───────────────────────────────────────────
function BeeswarmChart({ data }) {
  const W = 720, ROW_H = 64;
  const LEFT = 158, RIGHT = 28, TOP = 40, BOTTOM = 48;
  const PW = W - LEFT - RIGHT;
  const H = TOP + data.length * ROW_H + BOTTOM;
  const MAX_X = 120;
  const colors = ["#0079FF", "#95C492", "#F3AC92", "#E2C76E", "#6BAFA8", "#C8D8E8", "#7BAFD4", "#D4A0D0", "#A8B8D8"];
  const sx = v => LEFT + (v / MAX_X) * PW;
  const jitter = i => Math.sin(i * 17.31 + 0.7) * 13 * Math.cos(i * 3.17 + 1.1);
  const overallAvg = 25;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ overflow: "visible", fontFamily: "Inter, sans-serif" }}>
      {[0,15,30,45,60,75,90,105,120].map((v) => (
        <g key={v}>
          <line x1={sx(v)} y1={TOP - 10} x2={sx(v)} y2={H - BOTTOM} stroke="#c8c4be" strokeWidth={1} />
          <text x={sx(v)} y={H - BOTTOM + 14} textAnchor="middle" fill={MUTED} fontSize={9}>{v}{v === 120 ? "+" : ""}</text>
        </g>
      ))}
      <g>
        <line x1={sx(overallAvg)} y1={TOP - 28} x2={sx(overallAvg)} y2={H - BOTTOM} stroke={ACCENT} strokeWidth={1.5} strokeDasharray="4 3" />
        <text x={sx(overallAvg) + 3} y={TOP - 20} textAnchor="middle" fill={TEXT} fontSize={9} fontWeight="600">Overall avg: {overallAvg}</text>
      </g>
      {data.map((d, i) => {
        const color = colors[i % colors.length];
        const yc = TOP + i * ROW_H + ROW_H / 2;
        const bh = 14;
        return (
          <g key={d.cat}>
            {i % 2 === 0 && <rect x={LEFT} y={yc - ROW_H / 2} width={PW} height={ROW_H} fill="#00000004" />}
            <text x={LEFT - 8} y={yc - 5} textAnchor="end" fill={TEXT} fontSize={10} fontWeight="600">{d.cat}</text>
            <text x={LEFT - 8} y={yc + 9} textAnchor="end" fill={MUTED} fontSize={8}>n={d.n} · σ={d.std}</text>
            <rect x={sx(d.q1)} y={yc - bh / 2} width={Math.max(1, sx(d.q3) - sx(d.q1))} height={bh} fill={color} rx={2} opacity={0.4} />
            <line x1={sx(d.median)} y1={yc - bh / 2} x2={sx(d.median)} y2={yc + bh / 2} stroke={color} strokeWidth={2} />
            <text x={sx(d.mean)} y={yc + 4} textAnchor="middle" fill={color} fontSize={12} fontWeight="bold">×</text>
            {d.vals.map((v, j) => (
              <circle key={j} cx={sx(v)} cy={yc + jitter(j + i * 137)} r={2.2} fill={color} opacity={0.9} />
            ))}
          </g>
        );
      })}
      <g transform={`translate(${LEFT}, ${H - BOTTOM + 28})`}>
        <rect x={0} y={-4} width={40} height={8} fill={MUTED} opacity={0.15} rx={2} />
        <text x={46} y={3.5} fill={MUTED} fontSize={8}>Q1–Q3 box</text>
        <line x1={90} y1={0} x2={100} y2={0} stroke={MUTED} strokeWidth={2} />
        <text x={104} y={3.5} fill={MUTED} fontSize={8}>Median</text>
        <text x={148} y={3.5} fill={MUTED} fontSize={8}>× Mean</text>
        <circle cx={200} cy={0} r={2.2} fill={MUTED} opacity={0.5} />
        <text x={206} y={3.5} fill={MUTED} fontSize={8}>Each dot = 1 app</text>
      </g>
    </svg>
  );
}

      ))}

// ── prose ───────────────────────────────────────────────────────────
function EssayPreview() {
  return (
    <>
    <SideNav />
    <div className="wrap">
      <header className="title">
        <div className="kicker">Late Night Research Club · 001</div>
        <h1>The Long Onboarding: A Study of 1,460 Flows</h1>
        <div className="byline">By Rebekah Bek</div>
      </header>

      <h2 className="section" id="s1"><span className="num">I</span> The Raccoon<span className="subtitle">986 apps, 1,460 flows, and a calorie-counter with 61 screens</span></h2>

      <p className="lede">There is a screen inside an app called BitePal, buried about halfway through its onboarding, where the app asks you to name a raccoon.</p>

      <p>The raccoon is small and cartoon and it lives, for the moment, inside a bin. Someone drew the raccoon. Someone decided the bin was funny. You have not given the app your email. You have not paid for anything. You have not been shown, yet, what the app actually does. But the raccoon is there, and it needs a name, and the app will wait.</p>

      <p>I named mine Caramel.</p>

      <p>BitePal, if you haven't heard of it, is an AI calorie-counter. If you count every screen between the moment you tap the icon and the moment you arrive inside the product, you will count 61.</p>

      <p>That is almost two and a half times the overall average, and roughly four times the number of screens most people who write about onboarding will tell you is acceptable. And yet users walk through all 61, and then pay. BitePal did $400k in its first year.</p>

      <p>Everyone agrees, broadly, that onboarding should be short. Nielsen Norman Group recommends skipping it when you can. The growth writers treat every extra screen as a tax. This is the sort of consensus the internet does not often produce, and it has been produced here.</p>

      <p>So I went to Mobbin — where every onboarding flow from 986 apps is documented, screen by screen — and I looked at the numbers.</p>

      <p className="video-plug">The study this piece sits on top of — 1,460 onboarding flows in 8 minutes — is <a href="https://youtu.be/Qsq-Sj_rojU" target="_blank" rel="noopener noreferrer">here as a video</a>. Watch it for every chart included in this piece, plus flows that didn't make it in.</p>

      <p>The average app runs 25 onboarding screens. The range is 3 to 187.</p>

      <p>That is the first thing that did not match the consensus. A whole category of apps was running long — the kind of long the growth blogs write cautionary tales about — and the apps running longest were not the ones doing worse.</p>

      <p>Lemonade runs 143 screens. Monzo, 114. Noom, 113. Philips Hue, ninety-nine. Hinge, ninety-five. Duolingo, seventy-six. These are all well-regarded apps. None of them are apologizing for the length.</p>

      <p>At the other end: Google News, two screens. Procreate Pocket, two. Midjourney, three. Microsoft Copilot, four.</p>

      <p>So the collective wisdom was right about some apps, and wrong about others.</p>

      <div style={{ background: "#f5f2ee", border: `2px solid ${TEXT}`, borderRadius: 12, padding: "32px 28px 28px", margin: "48px 0" }}>
        <p style={{ fontFamily: "Inter, sans-serif", fontSize: 13, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: TEXT, margin: "0 0 20px" }}>What Mobbin's study of 1,460 onboarding flows found</p>
        <p style={{ margin: "0 0 14px", lineHeight: 1.55 }}><strong>1. Longer onboarding exists for a reason.</strong> The average app has 25 onboarding screens. The range is 3 to 187. The difference isn't best practice — it's what the app needs from you before it can start.</p>
        <p style={{ margin: "0 0 14px", lineHeight: 1.55 }}><strong>2. Most apps paywall without personalizing first.</strong> 71% of apps that paywall during onboarding never ask the user anything about themselves. The 6% that do run the longest flows.</p>
        <p style={{ margin: 0, lineHeight: 1.55 }}><strong>3. Five things make long flows feel short.</strong> A progress bar, personal questions, a mirror, a taste of the product, and a plan built from the answers. The apps that use them turn a hundred screens into a conversation.</p>
      </div>

      <h2 className="section" id="s2"><span className="num">II</span> How long is long<span className="subtitle">Finance averages 40 screens. AI averages 18. Length varies wildly by category.</span></h2>

      <p>25 screens. That is the number to put down first, because most of the conversation about onboarding is happening without it.</p>

      <p>It is a mean drawn across 986 apps on Mobbin, counting every screen — even the permission prompts, even the small illustrated pages most users don't register as screens at all.</p>

      <p>An average flattens. The better view is by category.</p>

      <Chart1_AvgByCategory />

      <p>Finance averages 40 screens. Health and Fitness, 36. Education and Lifestyle, 29. Then a long fall. Maps and Navigation lands at 13; Graphics and Design at 14.</p>

      <p>The long ones need to confirm something before they can begin — a regulatory check, a personal fact. The short ones don't: the user walked in already knowing what they came for. Compliance and personalization push the numbers up. Intent keeps them low.</p>

      <p>An AI tool and a health tracker are not playing the same game. Asking them to produce onboarding of comparable length is a category error.</p>

      <p>But the averages hide what's happening <em>inside</em> each category.</p>

      <Chart2_CategorySpread />

      <p>Some of these categories have figured out what their onboarding is for. Others are still arguing about it, inside their own bar.</p>

      <p>AI is the clearest case. Almost every AI product lives between 10 and 25 screens. Prompt, generation, user typing within a minute of opening the icon — the category has settled on <em>get to value fast</em>, and most of its apps have landed on the same number of screens to get there.</p>

      <p>Finance is the opposite. The category's standard deviation is 31.5; its range runs from 3 screens to 187. Cleo at 47 and Lemonade at 143 are both tagged Finance, but they are not, in any meaningful sense, running the same kind of flow. One has decided money is a product to use. The other has decided it is a risk to price. Most flows live somewhere on the line between.</p>

      <ScreenCompare />

      <p>"The right length for onboarding" is not one conversation. It is several, and they are asking different questions. The average — 25 screens — is where those differences disappear.</p>

      <Chart3_ByPlatform />

      <p>Platform turns out to matter less than you'd think. Web averages 21 screens; iOS, 27. The gap is real — about a fifth — and a good chunk of it is permissions. Mobile apps ask for location, notifications, camera access, tracking consent — each one an extra screen that web doesn't require. But the gap between platforms is small next to the gap between categories — and the categories are what matter.</p>

      <p style={{ padding: "18px 20px", background: "#f5f2ee", borderLeft: `3px solid ${ACCENT}`, borderRadius: "0 8px 8px 0", fontSize: "0.95em", margin: "24px 0" }}>A caveat: Mobbin's data shows what onboarding flows look like, not how they perform. We can see what well-regarded apps have in common. We cannot prove the commonality is the reason they're doing well. Copying a pattern will not copy a result.</p>

      <p>Length is not a universal variable. You cannot say an app's onboarding is long or short without first saying what kind of app it is, what the user came to do, or what the product has to confirm before it can begin.</p>

      <p>In every discussion of long onboarding flows, someone in the comments writes: <em>the best onboarding is the one with a skip button.</em></p>

      <div className="screen-compare">
        <div className="flow-row">
          <img className="flow-img" src="viz/screens/SCR-20260427-qzpq.png" alt="YouTube comment on the Mobbin onboarding video arguing for a skip button." loading="lazy" />
        </div>
        <div className="caption">Not making this up – here's a comment on the video this piece is built on.</div>
      </div>

      <p>It gets upvoted. It sounds right. And it is right — for an app where the user already knows what they came to do. For an app that needs to know who you are before it can help you, the skip button skips the part that makes the product work.</p>

      <h2 className="section" id="s3"><span className="num">III</span> Length follows the ask<span className="subtitle">The longer the flow, the more the app needs from you before it can start.</span></h2>

      <p>What sets the length of onboarding, more than anything, is what the user has to give the app before the app can do what it's for.</p>

      <p>Midjourney is three screens. You sign in, you read a line of house rules, and you arrive at a prompt box. The prompt box is the product. You came knowing you wanted to make a picture, and the app's one job is to get you to the place where the picture is made. Asking you anything else would be asking for something it did not need. So it doesn't.</p>

      <p>Noom is 113. The app is going to tell you how to eat. Before it can, it needs to know what you weigh and what you want to weigh, and how you have tried to get there before, and how you speak to yourself when it isn't going well, and whether you believe, in some small part, that you can change. You can see why it takes the screens it takes. I wouldn't trust a plan made for me by a stranger who doesn't know a single thing about me.</p>

      <Chart4_TopShortest />

      <p>At the short end, the pattern holds. Midjourney, 3. Google News, 2. Procreate Pocket, 2. Microsoft Copilot, 4. Amazon Shopping, 5. The user already has what the app needs — a picture, a search, a purchase — and the onboarding is where they hand it over. Then the app gets out of their way.</p>

      <p>The categories cluster. AI, Graphics and Design, News, Shopping, Maps and Navigation — the same ones that averaged low, for the same reason. The app's job is to close the distance as quickly as it can.</p>

      <p>The long end is doing something else.</p>

      <Chart5_LongestOther />

      <p>Philips Hue runs 99 screens because smart-home setup is a negotiation with hardware. Hinge, 95, because matchmaking is a negotiation with taste. Duolingo, 76, because the product has to teach you something, and teaching begins with placing you.</p>

      <p>None of these apps knows what to show you until you've told it who you are. You, the user, have an intention, but the intention is general — <em>find someone, learn a language, furnish a room with light</em> — and it has to be turned into something the app can act on. That's what the screens are for.</p>

      <p>Finance is doing something stranger — holding both kinds of long onboarding at once — but that's its own story. Outside Finance, the longest flows are mostly apps that need to know who you are first. Not your name and address, but what you want. What you won't do. What you like.</p>

      <p>I think the only bad version is the one with zero intent, where the app asks a lot and does nothing with it.</p>

      <PullQuote>An app that's going to tell you how to eat should probably ask what you eat first, and why.</PullQuote>

      <h2 className="section" id="s4"><span className="num">IV</span> The first five screens<span className="subtitle">By screen five, the user knows if the app was built for them.</span></h2>

      <p>When the app is going to ask that much — ninety screens, a hundred screens — what does the first one say?</p>

      <p>Most people treat onboarding as a preface. Something to get through before the product starts. A set of screens you move through in order to arrive at the thing you came for, which is somewhere else.</p>

      <p>The apps that know their audience don't treat onboarding this way.</p>

      <p>Someone opening Midjourney wants to make a picture. The emotional state is simple — intention, curiosity, a task. Someone opening Noom is doing something harder. They have decided, again, to try. There is hope in that, and underneath the hope, the weight of every previous attempt. You do not walk into that moment the same way you walk into a prompt box.</p>

      <p>Onboarding is the product's opening line. The first thing it says to the user, in the way the user will remember. Get it wrong and the user is five screens of forms deep, annoyed and losing interest, when they needed first to feel that the app understood why they were there.</p>

      <p>The tone is set by screen 2 or 3, and it is almost never revised. A user who feels interrogated early will carry that feeling through the remaining 80 screens. A user who feels heard will keep going — because the flow feels like it's going somewhere. This is why a flow of 25 screens by one app can feel like barely a minute, and a flow of 25 by another can feel like an interrogation. The screens are the same length. The feeling is different.</p>

      <p>You can feel it by the fourth or fifth screen of any good one. Duolingo's owl shows up and you know, already, that this is going to be the kind of app that cheers when you get a word right. Noom asks you what kind of person you are before it asks you anything else, and the asking tells you that the app believes the answer will matter. Headspace opens with a breath. BitePal opens, a little improbably, with a raccoon.</p>

      <div className="screen-compare">
        <div className="flow-row">
          <h4>Headspace · First screen</h4>
          <div className="meta">No questions. No sign-up form. Just: <em>Breathe in.</em></div>
          <img className="flow-img" src="viz/screens/Headspace iOS 0.png" alt="Headspace iOS first screen showing 'Breathe in' with the app's orange meditation character." loading="lazy" style={{ maxHeight: "420px", width: "auto", margin: "0 auto" }} />
          <div className="breadcrumb">Mobbin.com › Search "Headspace" › Flows › Onboarding</div>
        </div>
      </div>

      <p>Each of these is an opening line. Each of them is a promise.</p>

      <p>The apps that don't work have figured this out in the negative. The screens are not coordinated. The first question is a form field. The second is a permission request. The third is a discount code you did not ask for. Nobody thought about the flow, and by screen five the user knows it. What sets in is a disconnect: <em>this app is not going to give me what I want.</em> A long onboarding can open well. A short one can open badly. Length was never the variable.</p>

      <PullQuote>A long onboarding can open well. A short one can open badly. Length was never the variable.</PullQuote>

      <h2 className="section" id="s5"><span className="num">V</span> When long flows feel short<span className="subtitle">Inside Noom, Duolingo, and BitePal.</span></h2>

      <p>Walk through BitePal's 61 screens and you notice what they are not: a form. The progress bar appears early and never leaves. You can see that you are a quarter of the way through, then half, then three-quarters. The app is telling you that something is being assembled on the other side, and you keep going because you want to see what it is.</p>

      <p>A form is long. A conversation isn't, even when it takes the same amount of time.</p>

      <p>In Noom, each question is a slider between two statements.</p>

      <p>The first asks what you want. You can either reach a lower weight, or change your lifestyle to a healthier one. You drag a slider toward the one you agree with more. There are four positions: <em>Agree most</em> at each end, and <em>Agree a little more</em> on each side. No typing, no open-ended boxes. Just two statements and a continuum between them, and you committing to one.</p>

      <p>This goes on for ten questions. Some ask whether you need a program to reach your weight goals, or whether you can do it on your own. The questions are not factual. They are asking who you are, not what you weigh — and the slider gives you room to say you are <em>mostly</em> this kind of person, which feels more honest than radio buttons would.</p>

      <p>At the end of the ten questions, the app pauses. <em>Analyzing your profile…</em> appears on a soft green screen with a puzzle piece. When it finishes, it tells you who you are. You are a <em>Structure Seeker</em>. Or something like Structure Seeker — Noom has a few of these. <em>You're ready to get with the program. Hungry for innovation and invigoration — you will succeed in a new, promising environment.</em></p>

      <p>The sentence has the precision and emotional register of a horoscope reading, and it definitely made me feel seen — even when I knew what it was doing.</p>

      <p>From there, Noom shifts into something different. The screens that follow are positioning: Noom is based on real psychology, you can still eat your favorite foods, nothing is off limits, you will not be punished for messing up. First you talk, then Noom talks; by the time Noom starts talking, you are in the frame of mind to listen.</p>

      <p>Somewhere in there, Noom asks you a trivia question. <em>When is the best time to weigh yourself?</em> You pick <em>first thing in the morning, before you've eaten.</em> The next screen says <em>You're right!</em> with a citation to the International Journal of Behavioral Nutrition and Physical Activity. It makes you feel smart — like you've already learned something and are a step closer to succeeding. That is a different kind of flattery. The profile tells you who you are. This tells you what you can do.</p>

      <div className="screen-compare">
        <div className="flow-row">
          <h4>Noom · Structure Seeker</h4>
          <div className="meta">After ten slider questions, the app pauses, analyzes, and tells the user who they are.</div>
          <img className="flow-img" src="viz/screens/SCR-20260424-mvms.png" alt="Noom's Structure Seeker behavioral profile flow." loading="lazy" />
          <div className="breadcrumb">Mobbin.com › Search "Noom" › Flows › Onboarding › Completing a behavioral profile quiz</div>
        </div>
        <div className="flow-row">
          <h4>Noom · Behavior-change quiz</h4>
          <div className="meta">A trivia question, a right answer, a real citation — the user is being taught and being flattered in the same screen.</div>
          <img className="flow-img" src="viz/screens/SCR-20260424-mxwq.png" alt="Noom's behavior-change quiz." loading="lazy" />
          <div className="breadcrumb">Mobbin.com › Search "Noom" › Flows › Onboarding › Completing a behavioral profile quiz</div>
        </div>
        <div className="caption">The profile and the trivia, back to back. Screens from Mobbin.</div>
      </div>

      <p>None of this is necessary to open the app. None of it feels like length. In fact, it felt vaguely soothing — like a first therapy session.</p>

      <p>Duolingo does this too. By screen 8, the app is asking you to pick a language. By screen 12, you are doing a tiny first lesson. You get a word right. A small animation plays. The owl shows up. You are already learning, and the remaining 60-plus screens — yes, 60-plus — arrive as confirmation of something already underway. The onboarding has become the product.</p>

      <p>Headspace uses silence. You spend a screen breathing, before you are ever shown a feature. The breath itself is the thing you came to do. By the time Headspace starts asking questions — about your sleep, your stress, what brought you here — you have already meditated for 20 seconds. The questions arrive after the breath — in the aftermath of the thing you came for.</p>

      <p>BitePal, despite the length, does it too. Each screen is small. Each screen adds a piece to something that, by the time you reach the end, feels like it was stitched together just for you. The raccoon is part of this. You named the raccoon; it is in your plan; leaving means leaving Caramel in the bin.</p>

      <p>It still works on you even when you see what they're doing. Done well, a long onboarding is a conversation the user is enjoying, and wants to finish. Done well, a short one does the same work with less of the user's time — Headspace in 21 screens, Calm in 14.</p>

      <p>And then there are the apps that skip the conversation entirely. No questions, no profile, no plan — just the product, dropped in your lap. A library of meditations, a food log, every lesson at once. Without a conversation, the app is saying, whether they mean it or not: <em>I did not want to know you.</em></p>

      <PullQuote>A form is long. A conversation isn't, even when it takes the same amount of time.</PullQuote>

      <h2 className="section" id="s6"><span className="num">VI</span> The long walk to the paywall<span className="subtitle">71% of apps that paywall haven't asked the user anything first</span></h2>

      <p>By screen 72 of Noom's onboarding, something odd happens. Seven progress bars, stacked, filling in sequence. <em>Based on your answers…</em> <em>Preparing your profile…</em> <em>Calibrating your program…</em> One after another. You have been in the app for 8 minutes. You have answered questions you are not sure a calorie tracker needed to know. You have been told you are a Structure Seeker. You have agreed that your problem is not what you eat, exactly, but your relationship to it. You have been reading, for several screens, about research: meta-analyses, studies in the <em>International Journal of Behavioral Nutrition and Physical Activity</em>, a chart titled <em>Noom is better together — 32% faster</em>.</p>

      <p>Then the paywall arrives.</p>

      <div className="screen-compare">
        <div className="flow-row">
          <h4>Noom · Subscribing to personalised plan</h4>
          <div className="meta">The paywall as the next screen in the plan. The graph projecting weight loss. The plan with the user's name on it (<em>Judy's 2-Month Personalized Course</em>). The 15-minute reservation. The trial price.</div>
          <img className="flow-img" src="viz/screens/SCR-20260425-htcx.png" alt="Noom iOS subscription flow." loading="lazy" />
          <div className="breadcrumb">Mobbin.com › Search "Noom" › Flows › Onboarding › Subscribing to personalised plan</div>
        </div>
      </div>

      <p>It arrives not as a pitch, but as the next screen in the plan, and the plan is already yours. The Structure Seeker is on the page. The program is calibrating. The price is $209 for the year, at the time of writing. You are not being asked to buy a subscription. You are being asked if you want the thing you just spent 8 minutes describing.</p>

      <p>Most apps do not do this.</p>

      <Chart6_PaywallVsPersonal />

      <p>Of the 986 apps, 217 put up a paywall during onboarding. Of those, 155 — about 71% — ask for money without first asking the user anything about themselves. That number surprised me. Only 62 do both: personalize, then paywall. Those 62 run the longest flows on average — 42 screens. An app that does neither averages 21.</p>

      <p>The apps that personalize and paywall — roughly 6% of the sample — are writing a different kind of script.</p>

      <p>The script is roughly this. Ask the user about themselves. Not as a form — as a conversation where each answer visibly shapes what comes next. Build a little something from what they tell you. Show them the thing you built. Then, at the end, say: here is the plan. Here is what it costs. And let them decide.</p>

      <p>The other 71%: here is the product. It has features. Three tiers. One is on sale. Please enter your card.</p>

      <p>The user who has spent 8 minutes telling an app what they weigh, what they have tried, and how they speak to themselves in the morning, is no longer the same user who downloaded the app. They have invested something — not money (yet), but self-description and some level of vulnerability, which is harder to turn back from. The paywall, when it comes, is a continuation of everything the user just did. It is what the last 8 minutes were for.</p>

      <p>Conversely, the user who is handed the paywall on screen five has invested nothing. They are being pitched. They haven't agreed to be in a conversation, and they know a pitch when they see one. Their options are to pay or to leave, and you can guess which one they pick.</p>

      <Chart7_OfPaywalling />

      <p>The numbers back it up. Paywall-only apps come in at 31 screens. Personalize-only, 35. The ones that do both, 42.</p>

      <p>BitePal belongs to the 6%. Noom, too. Calm. All trial-gated — card up front, free for a week, billed on day eight. What the user gets in return for ninety screens is a plan with their name on it and an offer that feels like the next step, not a pitch. Length doesn't kill the sale. Length, done right, is the sale.</p>

      <PullQuote>Don't paywall before you've earned it.</PullQuote>

      <div style={{ height: "32px" }} />

      <p>Not everyone buys it. The same pattern — a personalized quiz that never mentioned a price was coming — gets called manipulative, with a passion. (There's a real comment on Mobbin's video about this, with 28 likes and 5 replies. They really hate it.) If the user doesn't know there's a paywall at the end, personalization isn't a conversation — it's a bait and switch. The pattern works. Just make sure the user knows what's coming.</p>

      <div style={{ height: "32px" }} />

      <p>Then there's Lemonade. Not every app that personalizes before the paywall is building a plan.</p>

      <p>Lemonade runs 143 screens. Tap through the first 15 screens — getting a quote on renters insurance — and what you find isn't a compliance document. It's a chatbot. <em>Maya</em> asks about your building. You answer. Maya tells you she's analyzing your data. <em>Connecting to municipal databases. Connecting to environmental databases.</em> A screen labeled <em>Analysis Complete</em> arrives, with star ratings: Building Age, four stars; Distance From Coast, four; Fire Hazard Proximity, three. The app is reflecting back what you told it, dressed up in stars.</p>

      <div className="screen-compare">
        <div className="flow-row">
          <h4>Lemonade · Getting a quote</h4>
          <div className="meta">Maya the chatbot in renters insurance. Personal questions (the building, the address), a loading sequence (<em>Connecting to municipal databases</em>), then the app reflects it back in star ratings. The flow ends in a quote.</div>
          <img className="flow-img" src="viz/screens/SCR-20260425-hpjd.png" alt="Lemonade iOS renters insurance onboarding." loading="lazy" />
          <div className="breadcrumb">Mobbin.com › Search "Lemonade" › Flows › Onboarding › Getting a quote</div>
        </div>
      </div>

      <p>What comes next is not a plan. It is a price.</p>

      <p>The flow does everything the good ones do — asks personal questions, shows you what it heard, makes you feel like something is being built. Except that, what's being built is a quote. The user, at the end of the flow, gets a price instead of a plan. Nothing here is technically wrong. The quote is accurate and necessary. But what Lemonade did was dress a transaction in the emotional language of a relationship.</p>

      <p>My own read: it's both clever and manipulative. It works, and that is precisely why I keep thinking about it.</p>

      <p style={{ padding: "18px 20px", background: "#f5f2ee", borderLeft: `3px solid ${ACCENT}`, borderRadius: "0 8px 8px 0", fontSize: "0.95em", margin: "24px 0" }}>A note on personalization: this study only covers onboarding flows. Some apps like Netflix, YouTube, and Spotify don't ask questions at all — they watch what you do and personalize from there.</p>

      <h2 className="section" id="s7"><span className="num">VII</span> Five things that work<span className="subtitle">What makes a hundred screens feel like a conversation.</span></h2>

      <p>Noom's flow worked for a reason. So did Duolingo's, and BitePal's. The same five things keep showing up.</p>

      <p>The earliest is <strong>the progress bar</strong>. It arrives on screen 2 or 3 — not at screen 20, not when the end is in sight, but right away. A progress bar is a promise: <em>there is an end to this, and here is how far in we are.</em> It keeps count of what has been built, not just what has been asked.</p>

      <p>Then, <strong>questions that feel personal</strong>. Noom's binary sliders, Hinge's prompts, BitePal's plate-shaped dietary questions — each asks the user something and offers, on the same screen, room to answer honestly. The opposite is a radio button with four pre-written options, none quite right. The personal question gives the user the sense that the app wanted the real answer, not the closest one. That small thing, repeated across a dozen screens, is what separates personalization from a survey.</p>

      <p>After the questions, <strong>a mirror</strong> that reflects what the user said. The app, having heard something about the user, tells them who they are. <em>Structure Seeker.</em> <em>Careful Beginner.</em> <em>Adventurous Saver.</em> The mirror is the app's response to the questions. It says: <em>I heard you, and this is what I understood.</em> Like an MBTI result — imprecise, unfalsifiable, and yet I eat it up. Every. Single. Time.</p>

      <p>Somewhere in the middle, <strong>a moment where the user tries the product</strong>. Before the paywall, before the plan is revealed, the app lets the user do the thing. Duolingo's first lesson, on screen 12. Headspace's 20-second breath. BitePal's raccoon. None of these is a preview. Each is a small taste of the product itself. A user who has already translated one word has become, in a tiny way, a language learner — and that small transformation is the point. This is where the app stops being a pitch and becomes something already experienced.</p>

      <p>Hinge does this at screen 15. The app asks you to write your profile answers — <em>Typical Sunday</em>, <em>My best Dad Joke</em>, <em>You should leave a comment if</em> — and suddenly you are doing the thing. You are being funny for a stranger. You are choosing which version of yourself to lead with. The onboarding is 95 screens long, and by screen 15, you are already on a dating app, creating the most dateable version of yourself.</p>

      <div className="screen-compare">
        <div className="flow-row">
          <h4>Hinge · Completing account setup</h4>
          <div className="meta">By screen 15, the user is writing profile prompts.</div>
          <img className="flow-img" src="viz/screens/SCR-20260427-qsfl.png" alt="Hinge iOS onboarding — photo upload, profile prompts (Typical Sunday, My best Dad Joke, You should leave a comment if), and voice prompt recording." loading="lazy" />
          <div className="breadcrumb">Mobbin.com › Search "Hinge" › Flows › Onboarding › Completing account setup</div>
        </div>
      </div>

      <p>Then, late in the flow, <strong>a plan built from their answers</strong>. The app shows the user what it assembled. <em>Here is your program. Here is what it will focus on. Here is when we think you will see results.</em> The plan is bespoke only in the sense that a restaurant meal is bespoke — the kitchen made it for you, out of ingredients it was always going to use. The user sees the ingredients as theirs.</p>

      <div className="screen-compare">
        <div className="flow-row">
          <h4>Duolingo · Onboarding</h4>
          <div className="meta">All five in one flow. Progress bar from screen one. A pause where the course is <em>building</em>. Then the placement, then the motivation.</div>
          <img className="flow-img" src="viz/screens/SCR-20260424-oqoj.png" alt="Duolingo iOS onboarding." loading="lazy" />
          <div className="breadcrumb">Mobbin.com › Search "Duolingo" › Flows › Onboarding</div>
        </div>
        <div className="caption">Duolingo running all five in its own voice. Screens from Mobbin.</div>
      </div>

      <p>The apps that get it wrong have the screens. The screens don't have a purpose.</p>

      <div className="pull-quote">
        <div className="pq-tag">Takeaway</div>
        <div>Five things turn a hundred screens into a conversation.</div>
        <ol style={{ textAlign: "left", margin: "12px auto 0", maxWidth: 360, paddingLeft: 20, fontSize: 13, lineHeight: 1.7 }}>
          <li>A progress bar</li>
          <li>Questions that feel personal</li>
          <li>A mirror that reflects what the user said</li>
          <li>A moment where the user tries the product</li>
          <li>A plan built from their answers</li>
        </ol>
      </div>

      <h2 className="section" id="s8"><span className="num">VIII</span> The right number<span className="subtitle">It was never about how many screens.</span></h2>

      <p>Midjourney runs 3 screens. Noom runs 113. Both are doing it right.</p>

      <p>What they share is a match between what the app is for and what it asks the user to do before it begins.</p>

      <div className="screen-compare">
        <div className="flow-row">
          <h4>Midjourney · The entire onboarding</h4>
          <div className="meta">A landing page, a sign-in, and the product. That is the flow.</div>

        </div>

      </div>

      <Chart9_PatternsOverall />

      <p>Across 986 apps, the patterns that make a long flow feel like a conversation are the less common ones. Personalization sits at 23%. Paywalls, 22%. Tutorials, 8%. Most apps are still just verifying identity and getting out of the way.</p>

      <p>Zoom out to the category level and the same split holds. The categories that paywall most are the ones running on subscription. The categories that personalize most are the ones where the product needs to know who you are. Health and Fitness and Education sit near the top of both — the asking and the selling have become the same flow.</p>

      <Chart11_PaywallByCat />

      <p>Personalization splits along the same lines.</p>

      <Chart12_PersonalizationByCat />

      <p>The conventional wisdom was simple: less friction, more conversions. Every extra screen is a chance for the user to leave. And for some apps — the ones where the user already knows what they came to do — that's right. Midjourney at 3 screens is not cutting corners. It's being true to what the user needs.</p>

      <p>But the apps running 80, 100, 113 screens aren't ignoring that advice out of carelessness. They're running long because the product doesn't work without what the user tells them first.</p>

      <PullQuote>Everyone has been arguing about how many screens. The apps that got it right were asking what the screens were for.</PullQuote>

      <h2 className="section" id="s9"><span className="num">IX</span> Caramel<span className="subtitle">The small things that someone fought for.</span></h2>

      <p>Caramel is still on my phone. I have not opened BitePal in weeks. I do not know whether I lost weight, or whether the app did what it said it would do.</p>

      <p>But somewhere in the 61 screens, a designer put a raccoon inside a functional flow — a small decision that suggested someone had cared about something not-entirely-functional. This is the kind of thing that gets flagged in review as <em>unnecessary</em>, or <em>shall we cut for brevity</em>, or <em>scope creep</em>. The small ornaments and strange little touches that someone fought for, and someone else quietly deleted.</p>

      <div className="caramel-hero">
        <img src="viz/screens/bitepal-caramel.png" alt="Caramel the raccoon, named during BitePal's onboarding." loading="lazy" />
        <div className="caption">Caramel.</div>
      </div>

      <p>Maybe they do not move a metric.</p>

      <p>What I know is that I still think about Caramel. Sixty-one screens, and the one I remember is the one that had nothing to do with onboarding.</p>
